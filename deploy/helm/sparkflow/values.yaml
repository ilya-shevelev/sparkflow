replicaCount:
  server: 1
  worker: 2

image:
  repository: ghcr.io/ilya-shevelev/sparkflow
  tag: latest
  pullPolicy: IfNotPresent

server:
  grpcPort: 9090
  httpPort: 8080
  metricsPort: 9091
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

worker:
  concurrency: 4
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

postgresql:
  enabled: true
  auth:
    database: sparkflow
    username: sparkflow
    password: sparkflow
  primary:
    persistence:
      size: 10Gi

serviceAccount:
  create: true
  name: sparkflow

service:
  type: ClusterIP
  grpcPort: 9090
  httpPort: 8080

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: sparkflow.local
      paths:
        - path: /
          pathType: Prefix

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
